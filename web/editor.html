<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tile Editor — Endless Ball Machine</title>
  <link rel="stylesheet" href="./editor.css?v=0.67">
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.4/full/pyodide.js"></script>
  <script data-goatcounter="https://ebm.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header class="topbar">
  <div><a href="./admin.html">← Special pages</a><h1>Tile Editor</h1></div>
  <div class="actions">
    <button id="import-button" type="button">Import .py</button>
    <input id="import-file" type="file" accept=".py,text/x-python" hidden>
    <button id="reset-button" type="button">Reset</button>
    <button id="download-button" type="button">Download .py</button>
    <button id="api-button" type="button" aria-controls="api-reference" aria-expanded="false">Help</button>
    <button id="run-button" type="button" class="primary">▶ Run</button>
  </div>
</header>
<main class="workspace">
  <section class="preview-pane">
    <div class="pane-toolbar">
      <label>Tile<select id="tile-select"><option>Loading tiles…</option></select></label>
      <div class="mode-switch view-switch" role="group" aria-label="Editor mode">
        <button class="active" data-view="simulation">Simulation</button><button data-view="validation">Validation</button>
      </div>
      <div class="mode-switch simulation-control" role="group" aria-label="Preview grid">
        <button class="active" data-mode="single">Single</button><button data-mode="repeat">3 × 3</button>
      </div>
      <button id="pause-button" class="simulation-control" type="button" aria-pressed="false">Pause simulation</button>
      <button id="validate-button" type="button">Validate flow</button>
    </div>
    <div class="tile-meta" id="tile-meta">
      <span id="tile-name">My Tile</span>
      <label>Author<input id="tile-author" type="text" placeholder="Your name"></label>
      <span id="tile-origin">Loading catalog…</span>
    </div>
    <canvas id="preview" aria-label="Tile preview"></canvas>
    <section class="status-panel">
      <div id="status" class="status pending">Loading Python runtime…</div>
      <div id="validation-results"></div>
    </section>
  </section>
  <section class="code-pane">
    <div class="code-heading"><span>Python source</span><span id="draft-state">Original</span></div>
    <div class="editor-shell" id="source-editor" aria-label="Python source editor"></div>
    <section class="console-panel" id="console-panel">
      <header><button id="console-toggle" type="button" aria-expanded="true">Console <span id="console-count">0</span></button><button id="console-clear" type="button">Clear</button></header>
      <div id="console-output" role="log" aria-live="polite"><div class="console-empty">Output from print() will appear here.</div></div>
    </section>
    <footer><span id="cursor-position">Ln 1, Col 1</span><span>Local autosave</span></footer>
  </section>
</main>
<aside id="api-reference" class="api-drawer" aria-hidden="true" aria-label="Tile authoring guide">
  <header><div><span class="eyebrow">Contributor help</span><h2>Tile authoring guide</h2></div><button id="api-close" type="button" aria-label="Close tile authoring guide">×</button></header>
  <div class="api-search"><input id="api-search" type="search" placeholder="Search rules, methods, recipes…"><span id="api-version"></span></div>
  <nav id="api-nav" aria-label="API sections"></nav>
  <div id="api-content" class="api-content"><p>Loading tile help…</p></div>
</aside>
<div id="api-backdrop" class="api-backdrop"></div>
<div id="loading"><div><h2>Starting Tile Editor</h2><p>Loading Pyodide and pymunk…</p></div></div>
<script src="./vendor/codemirror/editor-codemirror.js?v=0.61"></script>
<script type="module" src="./editor.js?v=0.67"></script>
</body>
</html>
